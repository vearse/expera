# NEEDS TEACHER REVIEW: indicator ranges, colours and substance pH values are typical textbook values.
indicators:
  - id: methyl-orange
    name: Methyl orange
    low: 3.1
    high: 4.4
    acidColour: { name: red, hex: "#c8323c" }
    transitionColour: { name: orange, hex: "#ec8a2c" }
    alkaliColour: { name: yellow, hex: "#f2d43d" }
    review: NEEDS_TEACHER_REVIEW
  - id: phenolphthalein
    name: Phenolphthalein
    low: 8.2
    high: 10.0
    acidColour: { name: colourless, hex: "#f4f7fb" }
    transitionColour: { name: pale pink, hex: "#f6c1d9" }
    alkaliColour: { name: pink, hex: "#d63384" }
    review: NEEDS_TEACHER_REVIEW
  - id: litmus
    name: Litmus
    low: 4.5
    high: 8.3
    acidColour: { name: red, hex: "#c8323c" }
    transitionColour: { name: purple, hex: "#7b4fa6" }
    alkaliColour: { name: blue, hex: "#2f6fd0" }
    review: NEEDS_TEACHER_REVIEW

