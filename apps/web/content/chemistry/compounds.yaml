# Ions, molecules and equations for the Learn builders.
# Names follow the IUPAC-style names used in Nigerian SS textbooks. NEEDS TEACHER REVIEW.
review: NEEDS_TEACHER_REVIEW

cations:
  - { id: na, symbol: Na, charge: 1, name: sodium }
  - { id: k, symbol: K, charge: 1, name: potassium }
  - { id: nh4, symbol: NH4, charge: 1, name: ammonium, polyatomic: true }
  - { id: ca, symbol: Ca, charge: 2, name: calcium }
  - { id: mg, symbol: Mg, charge: 2, name: magnesium }
  - { id: zn, symbol: Zn, charge: 2, name: zinc }
  - { id: pb, symbol: Pb, charge: 2, name: lead(II) }
  - { id: fe2, symbol: Fe, charge: 2, name: iron(II) }
  - { id: cu, symbol: Cu, charge: 2, name: copper(II) }
  - { id: al, symbol: Al, charge: 3, name: aluminium }
  - { id: fe3, symbol: Fe, charge: 3, name: iron(III) }

anions:
  - { id: cl, symbol: Cl, charge: -1, name: chloride }
  - { id: oh, symbol: OH, charge: -1, name: hydroxide, polyatomic: true }
  - { id: no3, symbol: NO3, charge: -1, name: trioxonitrate(V), polyatomic: true }
  - { id: hco3, symbol: HCO3, charge: -1, name: hydrogentrioxocarbonate(IV), polyatomic: true }
  - { id: o, symbol: O, charge: -2, name: oxide }
  - { id: so4, symbol: SO4, charge: -2, name: tetraoxosulphate(VI), polyatomic: true }
  - { id: so3, symbol: SO3, charge: -2, name: trioxosulphate(IV), polyatomic: true }
  - { id: co3, symbol: CO3, charge: -2, name: trioxocarbonate(IV), polyatomic: true }

# Coordinates in nanometre-like units (bond length about 1); angles are textbook values.
molecules:
  - id: water
    formula: H2O
    name: Water
    bondType: covalent
    shape: Bent (V-shaped)
    bondAngle: about 104.5°
    lonePairs: 2
    atoms:
      - { el: O, x: 0, y: 0, z: 0 }
      - { el: H, x: 0.791, y: -0.612, z: 0 }
      - { el: H, x: -0.791, y: -0.612, z: 0 }
    bonds: [[0, 1, 1], [0, 2, 1]]
    bondLengths:
      - { bond: "O-H", pm: 96 }
    review: NEEDS_TEACHER_REVIEW
  - id: carbon-dioxide
    formula: CO2
    name: "Carbon(IV) oxide"
    bondType: covalent
    shape: Linear
    bondAngle: 180°
    lonePairs: 0
    atoms:
      - { el: C, x: 0, y: 0, z: 0 }
      - { el: O, x: 1.16, y: 0, z: 0 }
      - { el: O, x: -1.16, y: 0, z: 0 }
    bonds: [[0, 1, 2], [0, 2, 2]]
    review: NEEDS_TEACHER_REVIEW
  - id: ammonia
    formula: NH3
    name: Ammonia
    bondType: covalent
    shape: Trigonal pyramidal
    bondAngle: about 107°
    lonePairs: 1
    atoms:
      - { el: N, x: 0, y: 0, z: 0 }
      - { el: H, x: 0.928, y: -0.372, z: 0 }
      - { el: H, x: -0.464, y: -0.372, z: 0.804 }
      - { el: H, x: -0.464, y: -0.372, z: -0.804 }
    bonds: [[0, 1, 1], [0, 2, 1], [0, 3, 1]]
    bondLengths:
      - { bond: "N-H", pm: 101 }
    review: NEEDS_TEACHER_REVIEW
  - id: oxygen
    formula: O2
    name: Oxygen
    bondType: covalent
    shape: Linear
    bondAngle: 180°
    lonePairs: 2
    stateAtRTP: gas
    atoms:
      - { el: O, x: 0.6, y: 0, z: 0 }
      - { el: O, x: -0.6, y: 0, z: 0 }
    bonds: [[0, 1, 2]]
    bondLengths:
      - { bond: "O=O", pm: 121 }
    review: NEEDS_TEACHER_REVIEW
  - id: nitrogen
    formula: N2
    name: Nitrogen
    bondType: covalent
    shape: Linear
    bondAngle: 180°
    lonePairs: 2
    stateAtRTP: gas
    atoms:
      - { el: N, x: 0.55, y: 0, z: 0 }
      - { el: N, x: -0.55, y: 0, z: 0 }
    bonds: [[0, 1, 3]]
    bondLengths:
      - { bond: "N≡N", pm: 110 }
    review: NEEDS_TEACHER_REVIEW
  - id: hydrogen
    formula: H2
    name: Hydrogen
    bondType: covalent
    shape: Linear
    bondAngle: 180°
    lonePairs: 0
    stateAtRTP: gas
    atoms:
      - { el: H, x: 0.37, y: 0, z: 0 }
      - { el: H, x: -0.37, y: 0, z: 0 }
    bonds: [[0, 1, 1]]
    bondLengths:
      - { bond: "H-H", pm: 74 }
    review: NEEDS_TEACHER_REVIEW
  - id: chlorine
    formula: Cl2
    name: Chlorine
    bondType: covalent
    shape: Linear
    bondAngle: 180°
    lonePairs: 6
    stateAtRTP: gas
    atoms:
      - { el: Cl, x: 0.99, y: 0, z: 0 }
      - { el: Cl, x: -0.99, y: 0, z: 0 }
    bonds: [[0, 1, 1]]
    bondLengths:
      - { bond: "Cl-Cl", pm: 199 }
    review: NEEDS_TEACHER_REVIEW
  - id: ethene
    formula: C2H4
    name: Ethene
    bondType: covalent
    shape: Planar (preview)
    bondAngle: about 120°
    lonePairs: 0
    stateAtRTP: gas
    atoms:
      - { el: C, x: 0.67, y: 0, z: 0 }
      - { el: C, x: -0.67, y: 0, z: 0 }
      - { el: H, x: 1.2, y: 0.9, z: 0 }
      - { el: H, x: 1.2, y: -0.9, z: 0 }
      - { el: H, x: -1.2, y: 0.9, z: 0 }
      - { el: H, x: -1.2, y: -0.9, z: 0 }
    bonds: [[0, 1, 2], [0, 2, 1], [0, 3, 1], [1, 4, 1], [1, 5, 1]]
    bondLengths:
      - { bond: "C=C", pm: 134 }
      - { bond: "C-H", pm: 109 }
    review: NEEDS_TEACHER_REVIEW
  - id: methane
    formula: CH4
    name: Methane
    bondType: covalent
    shape: Tetrahedral
    bondAngle: about 109.5°
    lonePairs: 0
    atoms:
      - { el: C, x: 0, y: 0, z: 0 }
      - { el: H, x: 0.629, y: 0.629, z: 0.629 }
      - { el: H, x: 0.629, y: -0.629, z: -0.629 }
      - { el: H, x: -0.629, y: 0.629, z: -0.629 }
      - { el: H, x: -0.629, y: -0.629, z: 0.629 }
    bonds: [[0, 1, 1], [0, 2, 1], [0, 3, 1], [0, 4, 1]]
    review: NEEDS_TEACHER_REVIEW
  - id: hydrogen-chloride
    formula: HCl
    name: Hydrogen chloride
    bondType: covalent
    shape: Linear
    bondAngle: "-"
    lonePairs: 3
    atoms:
      - { el: Cl, x: 0, y: 0, z: 0 }
      - { el: H, x: 1.27, y: 0, z: 0 }
    bonds: [[0, 1, 1]]
    review: NEEDS_TEACHER_REVIEW

equations:
  - { id: water, left: [H2, O2], right: [H2O], states: ["(g)", "(g)", "(l)"], answer: [2, 1, 2] }
  - { id: mg-o2, left: [Mg, O2], right: [MgO], states: ["(s)", "(g)", "(s)"], answer: [2, 1, 2] }
  - { id: neutral-h2so4, left: [H2SO4, NaOH], right: [Na2SO4, H2O], states: ["(aq)", "(aq)", "(aq)", "(l)"], answer: [1, 2, 1, 2] }
  - { id: caco3-hcl, left: [CaCO3, HCl], right: [CaCl2, H2O, CO2], states: ["(s)", "(aq)", "(aq)", "(l)", "(g)"], answer: [1, 2, 1, 1, 1] }
  - { id: methane-burn, left: [CH4, O2], right: [CO2, H2O], states: ["(g)", "(g)", "(g)", "(l)"], answer: [1, 2, 1, 2] }
  - { id: al-o2, left: [Al, O2], right: [Al2O3], states: ["(s)", "(g)", "(s)"], answer: [4, 3, 2] }
  - { id: zn-hcl, left: [Zn, HCl], right: [ZnCl2, H2], states: ["(s)", "(aq)", "(aq)", "(g)"], answer: [1, 2, 1, 1] }
  - { id: haber, left: [N2, H2], right: [NH3], states: ["(g)", "(g)", "(g)"], answer: [1, 3, 2] }

