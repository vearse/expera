  - { id: pbno3, formula: Pb(NO3)2, name: Lead(II) trioxonitrate(V), cation: pb, anion: no3 }
  - { id: al2so4, formula: Al2(SO4)3, name: Aluminium tetraoxosulphate(VI), cation: al, anion: so4 }
  - { id: nh4cl, formula: NH4Cl, name: Ammonium chloride, cation: nh4, anion: cl }
  - { id: na2co3, formula: Na2CO3, name: Sodium trioxocarbonate(IV), cation: na, anion: co3 }
  - { id: nahco3, formula: NaHCO3, name: Sodium hydrogentrioxocarbonate(IV), cation: na, anion: hco3 }
  - { id: na2so3, formula: Na2SO3, name: Sodium trioxosulphate(IV), cation: na, anion: so3 }
  - { id: mgso4, formula: MgSO4, name: Magnesium tetraoxosulphate(VI), cation: mg, anion: so4 }
  - { id: cacl2, formula: CaCl2, name: Calcium chloride, cation: ca, anion: cl }
  - { id: kno3, formula: KNO3, name: Potassium trioxonitrate(V), cation: k, anion: no3 }
