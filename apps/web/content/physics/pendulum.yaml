review: NEEDS_TEACHER_REVIEW
lab:
  title: Simple pendulum and oscillations
  subtitle: Time the swing. Plot the square. Find g.
  aim: Use a simple pendulum to investigate how period depends on length, amplitude and mass, then determine the acceleration of free fall from a graph of T squared against effective length.
  summary: Set up a pendulum, measure its effective length, time repeated oscillations and build a T squared against L graph. The simulation integrates the full nonlinear pendulum equation, so large-amplitude and damping effects are visible.
  hints:
    - Measure the length from the pivot to the centre of the bob, not to the bottom of the bob.
    - Time 10 or 20 oscillations and divide by the number of oscillations to reduce reaction-time error.
    - Use a small release angle when testing how length affects period.
    - Keep the same gravity setting while collecting the five lengths used to find g.
    - The gradient of a T squared against L graph is 4 pi squared divided by g.
  criteria:
    - Measure the effective length and release angle before timing.
    - Record at least five distinct lengths at the same gravity setting.
    - Time repeated oscillations rather than a single swing.
    - Plot T squared against L and calculate g from the best-fit gradient.
    - Compare the experimental g with the selected gravity value.
    - Explain at least one source of uncertainty.
  review: NEEDS_TEACHER_REVIEW
