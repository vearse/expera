tasks:
  - id: mass
    title: Does mass matter?
    description: Time two bobs of the same radius but different mass at the same length and angle. Compare the periods.
    review: NEEDS_TEACHER_REVIEW
  - id: amplitude
    title: Large-amplitude effect
    description: Compare a small release angle with a much larger one at the same length. Look for a measurable change in period.
    review: NEEDS_TEACHER_REVIEW
  - id: gravity
    title: Gravity changes the swing
    description: Repeat the same pendulum on Earth, the Moon and Mars. Compare the measured periods.
    review: NEEDS_TEACHER_REVIEW
  - id: damping
    title: Damping removes energy
    description: Switch damping on and observe the amplitude decreasing while the period stays nearly the same.
    review: NEEDS_TEACHER_REVIEW
