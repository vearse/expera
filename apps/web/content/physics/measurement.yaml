    review: NEEDS_TEACHER_REVIEW
samples:
  vernier:
    id: aluminium-rod
    name: Aluminium rod
    description: A short metal rod placed between the jaws. Close the jaws gently so the rod is not compressed.
    actualLengthMm: 23.4
    review: NEEDS_TEACHER_REVIEW
  micrometer:
    id: steel-feeler
    name: Steel feeler gauge
    description: A thin steel gauge. Use the ratchet until the spindle just touches it.
    actualThicknessMm: 5.76
    review: NEEDS_TEACHER_REVIEW
  metreRule:
    id: copper-wire
    name: Copper wire
    description: The zero end of the rule is worn. Place the wire between two readable marks and subtract the start reading.
    actualLengthCm: 12.3
