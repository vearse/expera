    description: Measure the empty cylinder, then the cylinder filled to the 40 cm3 mark.
    emptyMassG: 48.2
    filledMassG: 98.6
    volumeMl: 40
    acceptedDensityGCm3: 1.26
    review: NEEDS_TEACHER_REVIEW
stations:
  - id: vernier
    order: 1
    title: Vernier calipers
    short: Vernier
    summary: Close the jaws on the rod, identify the main-scale and Vernier readings, and record the length.
    hint: The Vernier scale reads to 0.1 mm. Find the coinciding division and add it to the main-scale reading.
    icon: straighten
    review: NEEDS_TEACHER_REVIEW
  - id: micrometer
    order: 2
    title: Micrometer screw gauge
    short: Micrometer
    summary: Measure the feeler gauge, then correct the observed reading for the positive zero error.
    hint: The thimble has 50 divisions and the pitch is 0.5 mm, so each thimble division is 0.01 mm.
    icon: precision_manufacturing
    review: NEEDS_TEACHER_REVIEW
  - id: metre-rule
    order: 3
    title: Metre rule and worn zero
    short: Metre rule
    summary: Measure the copper wire between two marks because the zero end of the rule is worn.
    hint: Length = end mark minus start mark. Do not measure from the damaged zero end.
    icon: straighten
    review: NEEDS_TEACHER_REVIEW
  - id: stopwatch
    order: 4
    title: Stopwatch
    short: Stopwatch
    summary: Start and stop the stopwatch, read the digital display and record the time interval.
    hint: Read the large seconds and the hundredths digits together. The display is in seconds.
    icon: timer
    review: NEEDS_TEACHER_REVIEW
  - id: parallax
    order: 5
    title: Parallax and eye position
    short: Parallax
    summary: Move your eye until the pointer lines up with the scale, then take the corrected scale reading.
    hint: Parallax disappears when your eye is level with the pointer and the scale is viewed straight on.
    icon: visibility
    review: NEEDS_TEACHER_REVIEW
  - id: density
    order: 6
    title: Density of solids and liquids
    short: Density
    summary: Measure the solid and the liquid, calculate both densities, and record the results with units.
    hint: For the solid, volume = pi x (diameter / 2)^2 x height. For the liquid, density = (filled mass - empty mass) / volume.
    icon: scale
    review: NEEDS_TEACHER_REVIEW
