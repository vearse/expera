review: NEEDS_TEACHER_REVIEW
defaultStationId: vernier
lab:
  title: Measurement and errors
  subtitle: Measure it, test it, prove it.
  aim: Use Vernier calipers, a micrometer screw gauge, a metre rule and a stopwatch to take readings, correct zero error and determine the density of a solid and a liquid.
  summary: Work through six precision-measurement stations. Every displayed reading is derived from the simulated apparatus, and the notebook only records readings you choose to take.
  hints:
    - Read a Vernier scale at the mark where a vernier division coincides with a main-scale division.
    - For a positive zero error, subtract the zero error from the observed reading.
    - Read a metre rule between two marks when the zero end is worn.
    - Align your eye with the pointer before taking a parallax-sensitive reading.
    - Density is mass divided by volume. Convert g/cm3 to kg/m3 by multiplying by 1000.
  criteria:
    - Take and record readings from each instrument.
    - Correct the micrometer reading for zero error.
    - Use a metre rule between two marks, not from the worn end.
    - Eliminate parallax by aligning the eye.
    - Determine the density of the solid and the liquid.
    - Record observations and a conclusion in the laboratory notebook.
  review: NEEDS_TEACHER_REVIEW
