    rangeMm: 150
    zeroErrorMm: 0
    review: NEEDS_TEACHER_REVIEW
  micrometer:
    name: Micrometer screw gauge
    pitchMm: 0.5
    thimbleDivisions: 50
    leastCountMm: 0.01
    rangeMm: 25
    zeroErrorMm: 0.02
    review: NEEDS_TEACHER_REVIEW
  metreRule:
    name: Metre rule
    lengthCm: 100
    smallestDivisionMm: 1
    wornZeroOffsetCm: 2
    review: NEEDS_TEACHER_REVIEW
  stopwatch:
    name: Stopwatch
    resolutionS: 0.01
    review: NEEDS_TEACHER_REVIEW
  balance:
    name: Digital balance
    resolutionG: 0.1
    review: NEEDS_TEACHER_REVIEW
  measuringCylinder:
    name: Measuring cylinder
    capacityMl: 100
    smallestDivisionMl: 1
    review: NEEDS_TEACHER_REVIEW
  parallax:
    name: Parallax scale
    trueReadingMm: 48
    parallaxFactor: 0.18
